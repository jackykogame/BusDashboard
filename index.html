<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴到站時間 Dashboard</title>
  <style>
    :root {
      --bg-yellow: #FFC72C;
      --card-bg: #FFFFFF;
      --kmb-green: #006B3F;
      --kmb-green-dark: #004D2D;
      --kmb-green-light: #E6F0EC;
      --text-dark: #1C1C1E;
      --text-muted: #6E6E73;
      --accent-red: #D9381E;
      --border-color: #E5E5EA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--text-dark);
      padding: 24px 16px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--text-dark);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .bus-icon {
      font-size: 2rem;
    }

    .refresh-btn {
      background-color: var(--kmb-green);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .refresh-btn:active {
      transform: scale(0.96);
      background-color: var(--kmb-green-dark);
    }

    .last-updated {
      font-size: 0.85rem;
      color: var(--text-dark);
      font-weight: 600;
      margin-bottom: 16px;
      text-align: right;
      opacity: 0.8;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    /* 巴士站牌風格卡片 */
    .bus-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      border: 2px solid #222;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background-color: var(--kmb-green);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--kmb-green-dark);
    }

    .route-badge {
      font-size: 2.2rem;
      font-weight: 900;
      background: #FFFFFF;
      color: var(--kmb-green);
      padding: 2px 14px;
      border-radius: 12px;
      letter-spacing: -0.5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .destination-box {
      text-align: right;
    }

    .dest-label {
      font-size: 0.75rem;
      opacity: 0.85;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .dest-name {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .stop-bar {
      background-color: var(--kmb-green-light);
      color: var(--kmb-green-dark);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0,107,63,0.15);
    }

    .stop-bar svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .eta-list {
      padding: 12px 16px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-grow: 1;
    }

    .eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #F8F9FA;
      border-radius: 12px;
      border-left: 4px solid #D1D1D6;
    }

    .eta-item.first-bus {
      background: #F0F9F5;
      border-left: 5px solid var(--kmb-green);
    }

    .eta-left {
      display: flex;
      flex-direction: column;
    }

    .eta-time {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-dark);
    }

    .eta-rmk {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .eta-mins {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--kmb-green);
    }

    .eta-mins.imminent {
      color: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    .no-data {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px 10px;
      }
      .header-title h1 {
        font-size: 1.4rem;
      }
      .route-badge {
        font-size: 1.8rem;
      }
      .dest-name {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <span class="bus-icon">🚌</span>
        <h1>巴士到站 Dashboard</h1>
      </div>
      <button class="refresh-btn" onclick="updateDashboard()">
        🔄 手動更新
      </button>
    </header>

    <div class="last-updated" id="update-time">正在載入數據...</div>

    <div class="dashboard-grid" id="dashboard">
      <!-- Cards generated dynamically -->
    </div>
  </div>

  <script>
    // 6 個目標測試站點配置
    const config = [
      { route: "219X", stopId: "B3EA17234A51AECF", stopName: "麗港城總站", dest: "尖沙咀 (循環線)" },
      { route: "219X", stopId: "9229D266EAEDEE31", stopName: "山谷道", dest: "尖沙咀 (循環線)" },
      { route: "17",   stopId: "BC1BFF94A5C1FBD0", stopName: "采頤花園", dest: "愛民" },
      { route: "621",  stopId: "B3EA17234A51AECF", stopName: "麗港城總站", dest: "中環 (香港站)" },
      { route: "621",  stopId: "F03328EFAC5F0BA1", stopName: "菲林明道", dest: "麗港城" },
      { route: "641",  stopId: "F03328EFAC5F0BA1", stopName: "菲林明道", dest: "啟業" }
    ];

    async function fetchETA(stopId, route) {
      try {
        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`);
        if (!res.ok) throw new Error("Network response was not ok");
        const json = await res.json();
        return json.data ? json.data.filter(item => item.route === route) : [];
      } catch (err) {
        console.error("API 讀取錯誤:", err);
        return null;
      }
    }

    function calculateMins(etaStr) {
      if (!etaStr) return { text: "暫無數據", mins: 999 };
      const eta = new Date(etaStr);
      const now = new Date();
      const diffMins = Math.round((eta - now) / 60000);
      
      if (diffMins <= 0) return { text: "即將到達", mins: 0 };
      if (diffMins > 120) {
        return { 
          text: eta.toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit', hour12: false}), 
          mins: diffMins 
        };
      }
      return { text: `${diffMins} 分鐘`, mins: diffMins };
    }

    async function updateDashboard() {
      const dashboard = document.getElementById("dashboard");
      
      const cardsData = await Promise.all(config.map(async (item) => {
        const etas = await fetchETA(item.stopId, item.route);
        return { item, etas };
      }));

      dashboard.innerHTML = "";

      cardsData.forEach(({ item, etas }) => {
        const card = document.createElement("div");
        card.className = "bus-card";

        let etaListHTML = "";

        if (etas === null) {
          etaListHTML = `<div class="no-data">⚠️ 網絡連線失敗或數據讀取錯誤</div>`;
        } else if (etas.length === 0) {
          etaListHTML = `<div class="no-data">暫無即時預計班次</div>`;
        } else {
          etaListHTML = '<ul class="eta-list">';
          etas.slice(0, 3).forEach((etaItem, idx) => {
            const timeFormatted = etaItem.eta 
              ? new Date(etaItem.eta).toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit', hour12: false}) 
              : "--:--";
            const minsInfo = calculateMins(etaItem.eta);
            const isImminent = minsInfo.mins <= 3 ? "imminent" : "";
            const isFirst = idx === 0 ? "first-bus" : "";

            etaListHTML += `
              <li class="eta-item ${isFirst}">
                <div class="eta-left">
                  <span class="eta-time">${timeFormatted}</span>
                  ${etaItem.rmk_tc ? `<span class="eta-rmk">${etaItem.rmk_tc}</span>` : ''}
                </div>
                <span class="eta-mins ${isImminent}">${minsInfo.text}</span>
              </li>
            `;
          });
          etaListHTML += '</ul>';
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="route-badge">${item.route}</div>
            <div class="destination-box">
              <div class="dest-label">往 TO</div>
              <div class="dest-name">${item.dest}</div>
            </div>
          </div>
          <div class="stop-bar">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            ${item.stopName}
          </div>
          ${etaListHTML}
        `;

        dashboard.appendChild(card);
      });

      const nowStr = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById("update-time").innerText = `最後更新時間：${nowStr} (每 30 秒自動刷新)`;
    }

    // 初始化載入 & 每 30 秒自動更新
    updateDashboard();
    setInterval(updateDashboard, 30000);
  </script>
</body>
</html>
