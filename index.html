<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>巴士 Dashboard (深層診斷修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between select-none">

    <!-- 頂部時間與標題 -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4 bg-white p-4 rounded-2xl shadow-sm">
        <div>
            <h1 class="text-2xl font-black tracking-wide text-emerald-700">出門 Dashboard</h1>
            <p class="text-xs text-slate-500 mt-0.5">即時到站時間 (雙重 API 交叉驗證版)</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-3xl font-extrabold tracking-wider text-amber-500">00:00:00</div>
            <div id="date" class="text-xs text-slate-500">----/--/--</div>
        </div>
    </header>

    <!-- 巴士路線列表卡片區 -->
    <main id="bus-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 my-auto">
        <div class="p-6 bg-white rounded-2xl text-slate-400 text-center border border-slate-200 shadow-sm">正在對 API 進行診斷與載入數據...</div>
    </main>

    <!-- API 診斷日誌區 (幫助定位具體連線阻檔或錯碼) -->
    <div class="mt-6 p-4 bg-slate-900 text-slate-200 rounded-2xl text-xs font-mono space-y-1 shadow-inner max-h-40 overflow-y-auto" id="debug-log">
        <div class="text-amber-400 font-bold">[系統診斷記錄] 正在初始化網路請求...</div>
    </div>

    <!-- 頁腳與控制區 -->
    <footer class="mt-4 flex justify-between items-center text-xs text-slate-500 border-t border-slate-200 pt-4">
        <span id="status-text">狀態：初始化中...</span>
        <button onclick="fetchAllETA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-xl active:scale-95 transition shadow-sm">
            🔄 強制重新載入
        </button>
    </footer>

    <script>
        const ROUTES_CONFIG = [
            {
                id: "219X_LKC",
                route: "219X",
                destText: "尖沙咀",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: null,
                serviceRemark: "班次：07:00-09:30 / 17:30-20:00"
            },
            {
                id: "219X_KRN",
                route: "219X",
                destText: "尖沙咀",
                stopName: "山谷道",
                kmbStopId: "BA06E8E2D7705B85",
                ctbStopId: null,
                serviceRemark: "班次：07:00-09:30 / 17:30-20:00"
            },
            {
                id: "17_RHM",
                route: "17",
                destText: "愛民",
                stopName: "采頤花園",
                kmbStopId: "B7EBFDEBC62C5B97",
                ctbStopId: null,
                serviceRemark: "全日服務"
            },
            {
                id: "621_LKC",
                route: "621",
                destText: "中環",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: "001737",
                serviceRemark: "晨早特別線 (07:10-08:40)"
            },
            {
                id: "621_WCH",
                route: "621",
                destText: "麗港城",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422",
                serviceRemark: "黃昏特別線 (17:35-18:30)"
            },
            {
                id: "641_KY",
                route: "641",
                destText: "啟業",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422",
                serviceRemark: "黃昏特別線 (17:15-19:30)"
            }
        ];

        function logDebug(msg, isError = false) {
            const logBox = document.getElementById('debug-log');
            const time = new Date().toLocaleTimeString();
            const colorClass = isError ? 'text-red-400' : 'text-emerald-400';
            logBox.innerHTML += `<div class="${colorClass}">[${time}] ${msg}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getMinutesDiff(etaTimeStr) {
            if (!etaTimeStr) return null;
            const etaTime = new Date(etaTimeStr);
            const now = new Date();
            if (isNaN(etaTime.getTime())) return null;
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);
            return diffMins < 0 ? 0 : diffMins;
        }

        // 獨立對 API 發起 Fetch，同時容許 CORS 與診斷
        async function fetchApiUrl(url) {
            try {
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) {
                    logDebug(`HTTP 錯誤 ${res.status}: ${url}`, true);
                    return null;
                }
                const json = await res.json();
                return json;
            } catch (err) {
                logDebug(`網絡/CORS連線失敗: ${url} (${err.message})`, true);
                return null;
            }
        }

        // 九巴雙路徑獲取 (路線+站點 API，以及單站點 API)
        async function fetchKMB(cfg) {
            if (!cfg.kmbStopId) return [];

            // 嘗試 Endpoint A: 站點總 ETA API
            const urlA = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${cfg.kmbStopId}`;
            const jsonA = await fetchApiUrl(urlA);
            
            let list = [];
            if (jsonA && Array.isArray(jsonA.data)) {
                list = jsonA.data.filter(item => {
                    const r = String(item.route || '').trim().toUpperCase();
                    return r === cfg.route.toUpperCase() && item.eta;
                });
            }

            // 如果 Endpoint A 沒查到，嘗試 Endpoint B: 站點+路線專屬 API
            if (list.length === 0) {
                const urlB = `https://data.etabus.gov.hk/v1/transport/kmb/eta/${cfg.kmbStopId}/${cfg.route}/1`;
                const jsonB = await fetchApiUrl(urlB);
                if (jsonB && Array.isArray(jsonB.data)) {
                    list = jsonB.data.filter(item => item.eta);
                }
            }

            return list.map(item => ({
                company: '九巴',
                eta: item.eta,
                rmk: item.rmk_tc || `往 ${cfg.destText}`
            }));
        }

        // 城巴 API 獲取
        async function fetchCTB(cfg) {
            if (!cfg.ctbStopId) return [];

            // 城巴政府 Open Data API
            const url = `https://rt.data.gov.hk/v1/transport/citybus/eta/CTB/${cfg.ctbStopId}/${cfg.route}`;
            const json = await fetchApiUrl(url);

            if (!json || !Array.isArray(json.data)) return [];

            return json.data
                .filter(item => item.eta)
                .map(item => ({
                    company: '城巴',
                    eta: item.eta,
                    rmk: item.rmk_tc || `往 ${cfg.destText}`
                }));
        }

        async function fetchAllETA() {
            const container = document.getElementById('bus-container');
            const statusText = document.getElementById('status-text');
            logDebug("開始執行全路線數據更新...");

            let totalFetchedCount = 0;
            let totalErrorCount = 0;

            const results = await Promise.all(ROUTES_CONFIG.map(async (cfg) => {
                const [kmb, ctb] = await Promise.all([fetchKMB(cfg), fetchCTB(cfg)]);
                const combined = [...kmb, ...ctb];

                // 剔除無效時間並按時間排序
                const valid = combined.filter(x => x.eta && !isNaN(new Date(x.eta).getTime()));
                valid.sort((a, b) => new Date(a.eta) - new Date(b.eta));

                totalFetchedCount += valid.length;

                return { cfg, etas: valid.slice(0, 3) };
            }));

            logDebug(`數據更新完成，成功取得 ${totalFetchedCount} 筆即時班次。`);
            statusText.innerText = `最後更新: ${new Date().toLocaleTimeString()}`;

            container.innerHTML = results.map(({ cfg, etas }) => {
                let etaBadgesHTML = '';

                if (!etas || etas.length === 0) {
                    etaBadgesHTML = `
                        <div class="p-3 bg-slate-100 rounded-xl text-slate-500 text-sm text-center border border-slate-200">
                            目前時段無班次 / 非服務時間
                            <div class="text-[11px] text-slate-400 mt-1">${cfg.serviceRemark}</div>
                        </div>
                    `;
                } else {
                    etaBadgesHTML = etas.map((item, index) => {
                        const mins = getMinutesDiff(item.eta);
                        const isFirst = index === 0;
                        const cardBg = isFirst 
                            ? 'bg-amber-50 text-amber-900 border-amber-300' 
                            : 'bg-emerald-50 text-emerald-900 border-emerald-200';
                        const badgeColor = isFirst ? 'text-amber-600 font-extrabold' : 'text-emerald-700 font-bold';
                        const timeText = mins === null ? '----' : (mins <= 0 ? '即將開出' : `${mins} 分鐘`);
                        const companyTag = item.company === '城巴' 
                            ? '<span class="bg-yellow-400 text-slate-900 font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">城巴</span>'
                            : '<span class="bg-red-600 text-white font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">九巴</span>';

                        return `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${cardBg} mb-2.5 shadow-sm">
                                <div class="flex items-center">
                                    ${companyTag}
                                    <span class="text-xs text-slate-500">${item.rmk}</span>
                                </div>
                                <span class="text-xl tracking-tight ${badgeColor}">${timeText}</span>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-3xl font-black text-emerald-600 tracking-tight">${cfg.route}</span>
                                <p class="text-base font-bold text-slate-800 mt-0.5">${cfg.stopName}</p>
                            </div>
                            <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full border border-emerald-200">往 ${cfg.destText}</span>
                        </div>
                        <div class="space-y-1">
                            ${etaBadgesHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchAllETA();
        setInterval(fetchAllETA, 30000);
    </script>
</body>
</html>
