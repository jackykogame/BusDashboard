<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>巴士實時到站 Dashboard</title>
  
  <!-- iOS PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="巴士到站">
  
  <style>
    :root {
      --bg-yellow: #fbc02d;
      --card-bg: #ffffff;
      --stop-green: #2e7d32;
      --kmb-red: #d32f2f;
      --ctb-blue: #005696;
      --text-dark: #212121;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--text-dark);
      padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom) 12px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 頂部標題與總控 */
    .dashboard-header {
      background: white;
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-area h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .title-area p {
      font-size: 0.8rem;
      color: #666;
      margin-top: 2px;
    }

    .refresh-btn {
      background-color: var(--stop-green);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .refresh-btn:active {
      transform: scale(0.95);
    }

    /* 路線卡片 (全出現在同一畫面) */
    .route-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .route-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .route-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .route-badge {
      background-color: var(--kmb-red);
      color: white;
      font-size: 1.5rem;
      font-weight: 900;
      padding: 3px 12px;
      border-radius: 10px;
      letter-spacing: 0.5px;
    }

    .route-badge.crossharbour {
      background-color: #005696;
    }

    .route-dest-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-dark);
    }

    .stop-pill {
      background-color: #e8f5e9;
      color: var(--stop-green);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 班次時間橫向/直向佈局 */
    .eta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }

    .eta-item {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 4px solid #ccc;
    }

    .eta-item.first {
      background: #fff8f8;
      border-left: 5px solid var(--kmb-red);
    }

    .eta-item .label {
      font-size: 0.75rem;
      color: #666;
      font-weight: 600;
    }

    .eta-item .time {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-dark);
      margin: 2px 0;
    }

    .eta-item .mins {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--stop-green);
    }

    .eta-item.first .mins {
      color: var(--kmb-red);
    }

    .status-msg {
      font-size: 0.88rem;
      color: #757575;
      font-weight: 600;
      padding: 10px 0;
      text-align: center;
    }

    .footer {
      text-align: center;
      padding: 12px 0 20px 0;
      font-size: 0.8rem;
      color: #424242;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頁面總標題卡片 -->
    <div class="dashboard-header">
      <div class="title-area">
        <h1>🚌 實時巴士 Dashboard</h1>
        <p id="update-time">最後更新: 載入中...</p>
      </div>
      <button class="refresh-btn" onclick="fetchAllETAs()">
        🔄 刷新全部
      </button>
    </div>

    <!-- 所有路線卡片容器 -->
    <div id="dashboard-cards" style="display: flex; flex-direction: column; gap: 14px;"></div>

    <div class="footer">
      自動每 30 秒更新 · 數據來源：九巴及城巴開放 API
    </div>
  </div>

  <script>
    const ROUTES_CONFIG = [
      {
        id: '219X_LC',
        route: '219X',
        dest: '往 尖沙咀 (循環線)',
        stopName: '麗港城總站',
        isCross: false,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/219X/1',
        filter: (item) => item.seq === 1 || (item.dir === 'O' && item.seq === 1)
      },
      {
        id: '219X_VR',
        route: '219X',
        dest: '往 麗港城',
        stopName: '紅磡山谷道',
        isCross: false,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/219X/1',
        filter: (item) => item.dest_tc.includes('麗港城') || item.dir === 'I' || item.seq > 8
      },
      {
        id: '17_RG',
        route: '17',
        dest: '往 愛民',
        stopName: '采頤花園',
        isCross: false,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/17/1',
        filter: (item) => item.dest_tc.includes('愛民')
      },
      {
        id: '621_CH',
        route: '621',
        dest: '往 中環(香港站)',
        stopName: '麗港城總站',
        isCross: true,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/621/1',
        filter: (item) => item.dest_tc.includes('中環') || item.seq === 1
      },
      {
        id: '621_LC',
        route: '621',
        dest: '往 麗港城',
        stopName: '灣仔菲林明道',
        isCross: true,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/621/1',
        filter: (item) => item.dest_tc.includes('麗港城')
      },
      {
        id: '641_KY',
        route: '641',
        dest: '往 啟業',
        stopName: '灣仔菲林明道',
        isCross: true,
        url: 'https://data.etabus.gov.hk/v1/transport/kmb/route-eta/641/1',
        filter: (item) => item.dest_tc.includes('啟業')
      }
    ];

    // 初始化渲染所有卡片骨架
    function initDashboardLayout() {
      const cardsContainer = document.getElementById('dashboard-cards');
      cardsContainer.innerHTML = '';

      ROUTES_CONFIG.forEach(cfg => {
        const cardHtml = `
          <div class="route-card" id="card-${cfg.id}">
            <div class="route-card-header">
              <div class="route-title-group">
                <div class="route-badge ${cfg.isCross ? 'crossharbour' : ''}">${cfg.route}</div>
                <div class="route-dest-text">${cfg.dest}</div>
              </div>
              <div class="stop-pill">📍 ${cfg.stopName}</div>
            </div>
            <div class="eta-grid" id="eta-grid-${cfg.id}">
              <div class="status-msg">正在更新到站時間...</div>
            </div>
          </div>
        `;
        cardsContainer.innerHTML += cardHtml;
      });
    }

    async function fetchAllETAs() {
      const now = new Date();
      document.getElementById('update-time').textContent = `最後更新: ${now.toLocaleTimeString('zh-HK')}`;

      // 並行獲取所有數據
      await Promise.all(ROUTES_CONFIG.map(async (cfg) => {
        const gridContainer = document.getElementById(`eta-grid-${cfg.id}`);
        try {
          const res = await fetch(cfg.url);
          const json = await res.json();

          if (!json.data || json.data.length === 0) {
            gridContainer.innerHTML = '<div class="status-msg">目前暫無班次資料或非服務時間</div>';
            return;
          }

          let filtered = json.data.filter(cfg.filter);
          if (filtered.length === 0) filtered = json.data;

          const validEtas = filtered
            .filter(item => item && item.eta)
            .sort((a, b) => new Date(a.eta) - new Date(b.eta));

          if (validEtas.length === 0) {
            gridContainer.innerHTML = '<div class="status-msg">目前暫無班次資料或已過尾班車</div>';
            return;
          }

          gridContainer.innerHTML = '';

          // 顯示前 3 班車
          validEtas.slice(0, 3).forEach((item, index) => {
            const etaTime = new Date(item.eta);
            const diffMins = Math.max(0, Math.round((etaTime - now) / 60000));
            const timeStr = etaTime.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', hour12: false });
            const rmk = item.rmk_tc ? ` (${item.rmk_tc})` : '';
            const isFirst = index === 0;

            const itemHtml = `
              <div class="eta-item ${isFirst ? 'first' : ''}">
                <div class="label">${isFirst ? '🔴 下一班' : `班次 #${index + 1}`}${rmk}</div>
                <div class="time">${timeStr}</div>
                <div class="mins">${diffMins} 分鐘後</div>
              </div>
            `;
            gridContainer.innerHTML += itemHtml;
          });

        } catch (err) {
          console.error(`Error fetching ${cfg.id}:`, err);
          gridContainer.innerHTML = '<div class="status-msg" style="color: #c62828;">讀取失敗</div>';
        }
      }));
    }

    // 初始化與執行
    initDashboardLayout();
    fetchAllETAs();

    // 每 30 秒自動刷新全頁
    setInterval(fetchAllETAs, 30000);
  </script>
</body>
</html>
