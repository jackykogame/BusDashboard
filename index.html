<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>219X 麗港城總站 - 測試 Dashboard</title>
  <style>
    :root {
      --bg-yellow: #FFC72C;
      --card-bg: #FFFFFF;
      --kmb-green: #006B3F;
      --kmb-green-dark: #004D2D;
      --kmb-green-light: #E6F0EC;
      --text-dark: #1C1C1E;
      --accent-red: #D9381E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-yellow); color: var(--text-dark); padding: 20px 16px; min-height: 100vh; }
    .container { max-width: 500px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; font-weight: 800; }
    
    .refresh-btn {
      background-color: var(--kmb-green); color: white; border: none;
      padding: 10px 16px; border-radius: 20px; font-weight: 700; cursor: pointer;
    }

    .bus-card {
      background: var(--card-bg); border-radius: 20px; overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.12); border: 2px solid #222; margin-bottom: 20px;
    }

    .card-header {
      background-color: var(--kmb-green); color: white; padding: 16px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .route-badge { font-size: 2.2rem; font-weight: 900; background: #FFF; color: var(--kmb-green); padding: 2px 14px; border-radius: 12px; }
    .dest-name { font-size: 1.2rem; font-weight: 800; text-align: right; }
    .stop-bar { background-color: var(--kmb-green-light); color: var(--kmb-green-dark); padding: 12px 16px; font-size: 1rem; font-weight: 700; }

    .eta-list { padding: 16px; list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .eta-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: #F8F9FA; border-radius: 12px; border-left: 5px solid var(--kmb-green);
    }
    .eta-time { font-size: 1.1rem; font-weight: 700; }
    .eta-mins { font-size: 1.3rem; font-weight: 800; color: var(--kmb-green); }
    .eta-mins.imminent { color: var(--accent-red); }

    .debug-box {
      background: #222; color: #00FF66; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚌 219X 單站測試</h1>
      <button class="refresh-btn" onclick="testSingleStop()">🔄 刷新數據</button>
    </header>

    <div class="bus-card">
      <div class="card-header">
        <div class="route-badge">219X</div>
        <div class="dest-name">往 尖沙咀 (循環線)</div>
      </div>
      <div class="stop-bar">📍 麗港城總站 (自動尋找第一站)</div>
      <div id="eta-container" style="padding:16px; text-align:center;">載入中...</div>
    </div>

    <h3>🔍 API 調試資訊 (Debug Log)</h3>
    <div class="debug-box" id="debug-log">正在初始化診斷...</div>
  </div>

  <script>
    function log(msg) {
      const debugBox = document.getElementById("debug-log");
      debugBox.innerText += "
" + msg;
    }

    async function testSingleStop() {
      const container = document.getElementById("eta-container");
      document.getElementById("debug-log").innerText = "開始連線測試...";
      container.innerHTML = "正在向九巴 API 查詢...";

      try {
        // 1. 動態取得 219X 去程的第一個站點 (麗港城總站 Stop ID)
        log("1. 正在獲取 219X 路線總站資訊...");
        const routeStopUrl = "https://data.etabus.gov.hk/v1/transport/kmb/route-stop/219X/outbound/1";
        const resRoute = await fetch(routeStopUrl);
        const jsonRoute = await resRoute.json();
        
        if (!jsonRoute.data || jsonRoute.data.length === 0) {
          throw new Error("無法取得 219X 路線站點資料");
        }

        const firstStopId = jsonRoute.data[0].stop;
        log(`✅ 成功獲取麗港城總站 Stop ID: ${firstStopId}`);

        // 2. 拿取該站點的即時 ETA 到站時間
        log("2. 正在讀取該站點到站時間 (stop-eta)...");
        const etaUrl = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${firstStopId}`;
        const resEta = await fetch(etaUrl);
        const jsonEta = await resEta.json();

        log(`✅ 站點 ETA 回傳成功！總筆數: ${jsonEta.data ? jsonEta.data.length : 0}`);

        // 3. 過濾出 219X 去程 (dir: "O") 且 service_type == 1 的班次
        const matched = (jsonEta.data || []).filter(x => x.route === "219X" && x.dir === "O");
        log(`🔍 匹配 219X 去程班次: ${matched.length} 筆`);

        if (matched.length === 0) {
          container.innerHTML = '<div style="color:#888;">目前非服務時間或暫無班次</div>';
          log("⚠️ 注意: API 沒有回傳 219X 去程有效班次 (可能已尾班車或未開車)");
          return;
        }

        // 4. 渲染到站時間
        let html = '<ul class="eta-list">';
        matched.slice(0, 3).forEach(item => {
          if (!item.eta) return;
          const etaTime = new Date(item.eta);
          const now = new Date();
          const diffMins = Math.round((etaTime - now) / 60000);
          
          const timeStr = etaTime.toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit', hour12: false});
          const minsStr = diffMins <= 0 ? "即將到達" : `${diffMins} 分鐘`;
          const isImminent = diffMins <= 3 ? "imminent" : "";

          html += `
            <li class="eta-item">
              <div>
                <span class="eta-time">${timeStr}</span>
                ${item.rmk_tc ? `<div style="font-size:0.75rem; color:#666;">${item.rmk_tc}</div>` : ''}
              </div>
              <span class="eta-mins ${isImminent}">${minsStr}</span>
            </li>
          `;
        });
        html += '</ul>';
        container.innerHTML = html;

      } catch (err) {
        log(`❌ 錯誤發生: ${err.message}`);
        container.innerHTML = `<div style="color:red; font-weight:bold;">測試失敗: ${err.message}</div>`;
      }
    }

    testSingleStop();
  </script>
</body>
</html>
