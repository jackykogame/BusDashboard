<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>巴士 Dashboard</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between select-none">

    <!-- 頂部時間與標題 -->
    <header class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold tracking-wide text-slate-100">出門 Dashboard</h1>
            <p class="text-xs text-slate-400 mt-1">即時到站時間 (ETA)</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-3xl font-extrabold tracking-wider text-amber-400">00:00:00</div>
            <div id="date" class="text-xs text-slate-400">----/--/--</div>
        </div>
    </header>

    <!-- 巴士路線列表卡片區 -->
    <main id="bus-container" class="grid grid-cols-1 md:grid-cols-2 gap-4 my-auto">
        <!-- 卡片會由 JavaScript 動態生成 -->
    </main>

    <!-- 頁腳與控制區 -->
    <footer class="mt-6 flex justify-between items-center text-xs text-slate-500 border-t border-slate-800 pt-4">
        <span>數據來源：Data.gov.hk (KMB)</span>
        <button onclick="fetchAllETA()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg active:scale-95 transition">
            🔄 立即更新
        </button>
    </footer>

    <script>
        // ==========================================
        // 設定監控路線：219X 麗港城總站 往 尖沙咀
        // ==========================================
        const ROUTES_TO_MONITOR = [
            {
                route: "219X",
                bound: "O", // O = Outbound (去程：麗港城 往 尖沙咀)
                stopId: "C1BD1F3A215CD41F", // 麗港城總站 Stop ID
                stopName: "麗港城總站",
                destination: "尖沙咀"
            }
        ];

        // ==========================================
        // 時鐘功能
        // ==========================================
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ==========================================
        // 獲取九巴即時 ETA API
        // ==========================================
        async function fetchETA(item) {
            try {
                // 九巴 API 格式：/v1/transport/kmb/eta/{stop_id}/{route}/{service_type}
                const response = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${item.stopId}/${item.route}/1`);
                const data = await response.json();
                
                // 過濾對應方向的班次
                const etas = data.data.filter(e => e.dir === item.bound).slice(0, 3);
                return etas;
            } catch (err) {
                console.error("Fetch ETA error:", err);
                return [];
            }
        }

        // 計算距離現在還有幾分鐘
        function getMinutesDiff(etaTimeStr) {
            if (!etaTimeStr) return null;
            const etaTime = new Date(etaTimeStr);
            const now = new Date();
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);
            return diffMins < 0 ? 0 : diffMins;
        }

        // Render 卡片
        async function fetchAllETA() {
            const container = document.getElementById('bus-container');
            container.innerHTML = '';

            for (const item of ROUTES_TO_MONITOR) {
                const etas = await fetchETA(item);
                
                let etaBadgesHTML = '';
                if (!etas || etas.length === 0) {
                    etaBadgesHTML = `<div class="p-3 bg-slate-800/50 rounded-lg text-slate-500 text-sm text-center">暫無即時到站資料</div>`;
                } else {
                    etaBadgesHTML = etas.map((eta, index) => {
                        const mins = getMinutesDiff(eta.eta);
                        const isFirst = index === 0;
                        const bgColor = isFirst ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-slate-800 text-slate-300 border-slate-700';
                        const timeText = mins === null ? '----' : (mins <= 0 ? '即將到站' : `${mins} 分鐘`);
                        
                        return `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${bgColor} mb-2.5">
                                <span class="text-xs text-slate-400">${eta.rmk_tc || '往 ' + item.destination}</span>
                                <span class="text-xl font-bold tracking-tight">${timeText}</span>
                            </div>
                        `;
                    }).join('');
                }

                const cardHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                        <div class="flex justify-between items-start mb-5">
                            <div>
                                <span class="text-4xl font-black text-rose-500 tracking-tight">${item.route}</span>
                                <p class="text-base font-semibold text-slate-200 mt-1">${item.stopName}</p>
                            </div>
                            <span class="text-xs font-medium bg-slate-800 text-slate-400 px-3 py-1.5 rounded-full border border-slate-700">往 ${item.destination}</span>
                        </div>
                        <div class="space-y-1">
                            ${etaBadgesHTML}
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            }
        }

        // 初始化加載與自動定時刷新 (每 30 秒更新一次)
        fetchAllETA();
        setInterval(fetchAllETA, 30000);
    </script>
</body>
</html>
