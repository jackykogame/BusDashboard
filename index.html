<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>九巴到站時間 Dashboard</title>
  <style>
    :root {
      --bg-yellow: #FFC72C;
      --card-bg: #FFFFFF;
      --kmb-green: #006B3F;
      --kmb-green-dark: #004D2D;
      --kmb-green-light: #E6F0EC;
      --text-dark: #1C1C1E;
      --text-muted: #6E6E73;
      --accent-red: #D9381E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-yellow);
      color: var(--text-dark);
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 3px solid var(--text-dark);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.8rem;
      font-weight: 800;
    }

    .refresh-btn {
      background-color: var(--kmb-green);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .refresh-btn:active {
      transform: scale(0.96);
      background-color: var(--kmb-green-dark);
    }

    .last-updated {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: right;
      opacity: 0.85;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .bus-card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      border: 2px solid #222;
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background-color: var(--kmb-green);
      color: white;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .route-badge {
      font-size: 2.2rem;
      font-weight: 900;
      background: #FFFFFF;
      color: var(--kmb-green);
      padding: 2px 14px;
      border-radius: 12px;
    }

    .destination-box {
      text-align: right;
    }

    .dest-label {
      font-size: 0.75rem;
      opacity: 0.85;
    }

    .dest-name {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .stop-bar {
      background-color: var(--kmb-green-light);
      color: var(--kmb-green-dark);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border-bottom: 1px solid rgba(0,107,63,0.15);
    }

    .eta-list {
      padding: 12px 16px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #F8F9FA;
      border-radius: 12px;
      border-left: 4px solid #D1D1D6;
    }

    .eta-item.first-bus {
      background: #F0F9F5;
      border-left: 5px solid var(--kmb-green);
    }

    .eta-left {
      display: flex;
      flex-direction: column;
    }

    .eta-time {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .eta-rmk {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .eta-mins {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--kmb-green);
    }

    .eta-mins.imminent {
      color: var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    .no-data {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-title">
        <span>🚌</span>
        <h1>巴士到站 Dashboard</h1>
      </div>
      <button class="refresh-btn" onclick="updateDashboard()">🔄 手動更新</button>
    </header>

    <div class="last-updated" id="update-time">正在載入數據...</div>

    <div class="dashboard-grid" id="dashboard"></div>
  </div>

  <script>
    const config = [
      { route: "219X", stopName: "麗港城總站", dest: "尖沙咀 (循環線)", dir: "O", serviceType: "1" },
      { route: "219X", stopName: "山谷道", dest: "尖沙咀 (循環線)", dir: "O", serviceType: "1" },
      { route: "17",   stopName: "采頤花園", dest: "愛民", dir: "I", serviceType: "1" },
      { route: "621",  stopName: "麗港城總站", dest: "中環 (香港站)", dir: "O", serviceType: "1" },
      { route: "621",  stopName: "菲林明道", dest: "麗港城", dir: "I", serviceType: "1" },
      { route: "641",  stopName: "菲林明道", dest: "啟業", dir: "I", serviceType: "1" }
    ];

    async function fetchETAByRoute(route, serviceType) {
      try {
        const url = `https://data.etabus.gov.hk/v1/transport/kmb/route-eta/${route}/${serviceType}`;
        const res = await fetch(url);
        if (!res.ok) return null;
        const json = await res.json();
        return json.data || [];
      } catch (e) {
        console.error("API 讀取失敗:", e);
        return null;
      }
    }

    function calculateMins(etaStr) {
      if (!etaStr) return { text: "暫無班次", mins: 999 };
      const eta = new Date(etaStr);
      const now = new Date();
      const diffMins = Math.round((eta - now) / 60000);
      
      if (diffMins <= 0) return { text: "即將到達", mins: 0 };
      if (diffMins > 120) {
        return { 
          text: eta.toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit', hour12: false}), 
          mins: diffMins 
        };
      }
      return { text: `${diffMins} 分鐘`, mins: diffMins };
    }

    async function updateDashboard() {
      const dashboard = document.getElementById("dashboard");
      
      const routeDataMap = {};
      for (const item of config) {
        const key = `${item.route}_${item.serviceType}`;
        if (!routeDataMap[key]) {
          routeDataMap[key] = await fetchETAByRoute(item.route, item.serviceType);
        }
      }

      dashboard.innerHTML = "";

      config.forEach(item => {
        const key = `${item.route}_${item.serviceType}`;
        const rawList = routeDataMap[key];

        const card = document.createElement("div");
        card.className = "bus-card";

        let etaListHTML = "";

        if (rawList === null) {
          etaListHTML = `<div class="no-data">⚠️ API 讀取失敗</div>`;
        } else {
          const matchedEtas = rawList.filter(x => 
            x.dir === item.dir && 
            x.stop_name_tc === item.stopName && 
            x.eta
          );

          if (matchedEtas.length === 0) {
            etaListHTML = `<div class="no-data">暫無即時預計班次</div>`;
          } else {
            etaListHTML = '<ul class="eta-list">';
            matchedEtas.slice(0, 3).forEach((etaItem, idx) => {
              const timeFormatted = new Date(etaItem.eta).toLocaleTimeString('zh-HK', {hour: '2-digit', minute:'2-digit', hour12: false});
              const minsInfo = calculateMins(etaItem.eta);
              const isImminent = minsInfo.mins <= 3 ? "imminent" : "";
              const isFirst = idx === 0 ? "first-bus" : "";

              etaListHTML += `
                <li class="eta-item ${isFirst}">
                  <div class="eta-left">
                    <span class="eta-time">${timeFormatted}</span>
                    ${etaItem.rmk_tc ? `<span class="eta-rmk">${etaItem.rmk_tc}</span>` : ''}
                  </div>
                  <span class="eta-mins ${isImminent}">${minsInfo.text}</span>
                </li>
              `;
            });
            etaListHTML += '</ul>';
          }
        }

        card.innerHTML = `
          <div class="card-header">
            <div class="route-badge">${item.route}</div>
            <div class="destination-box">
              <div class="dest-label">往 TO</div>
              <div class="dest-name">${item.dest}</div>
            </div>
          </div>
          <div class="stop-bar">📍 ${item.stopName}</div>
          ${etaListHTML}
        `;

        dashboard.appendChild(card);
      });

      const nowStr = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      document.getElementById("update-time").innerText = `最後更新時間：${nowStr} (每 30 秒自動刷新)`;
    }

    updateDashboard();
    setInterval(updateDashboard, 30000);
  </script>
</body>
</html>
