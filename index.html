<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>巴士 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between select-none bg-white">

    <!-- 頂部時間與標題 -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
        <div>
            <h1 class="text-2xl font-black tracking-wide text-emerald-700">出門 Dashboard</h1>
            <p class="text-xs text-slate-500 mt-0.5">即時到站時間 (即時數據版)</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-3xl font-extrabold tracking-wider text-amber-500">00:00:00</div>
            <div id="date" class="text-xs text-slate-500">----/--/--</div>
        </div>
    </header>

    <!-- 巴士路線列表卡片區 -->
    <main id="bus-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 my-auto">
        <div class="p-6 bg-slate-50 rounded-2xl text-slate-400 text-center border border-slate-200 shadow-sm">載入路線數據中...</div>
    </main>

    <!-- 頁腳與控制區 -->
    <footer class="mt-6 flex justify-between items-center text-xs text-slate-500 border-t border-slate-200 pt-4">
        <span id="status-text">數據來源：Data.gov.hk (九巴 & 城巴 API)</span>
        <button onclick="fetchAllETA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 rounded-lg active:scale-95 transition shadow-sm">
            🔄 立即更新
        </button>
    </footer>

    <script>
        // 6 個路線配置與通用 API 設定
        const ROUTES_CONFIG = [
            {
                id: "219X_LKC",
                route: "219X",
                destText: "尖沙咀",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: null
            },
            {
                id: "219X_KRN",
                route: "219X",
                destText: "尖沙咀",
                stopName: "山谷道",
                kmbStopId: "BA06E8E2D7705B85",
                ctbStopId: null
            },
            {
                id: "17_RHM",
                route: "17",
                destText: "愛民",
                stopName: "采頤花園",
                kmbStopId: "B7EBFDEBC62C5B97",
                ctbStopId: null
            },
            {
                id: "621_LKC",
                route: "621",
                destText: "中環",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: "001737"
            },
            {
                id: "621_WCH",
                route: "621",
                destText: "麗港城",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422"
            },
            {
                id: "641_KY",
                route: "641",
                destText: "啟業",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422"
            }
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getMinutesDiff(etaTimeStr) {
            if (!etaTimeStr) return null;
            const etaTime = new Date(etaTimeStr);
            const now = new Date();
            if (isNaN(etaTime.getTime())) return null;
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);
            return diffMins < 0 ? 0 : diffMins;
        }

        async function safeFetchJson(url) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                const res = await fetch(url, { signal: controller.signal, cache: 'no-cache' });
                clearTimeout(timeoutId);
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                console.warn("Fetch failed:", url, e);
                return null;
            }
        }

        async function fetchKMBETA(cfg) {
            if (!cfg.kmbStopId) return [];
            const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${cfg.kmbStopId}`;
            const json = await safeFetchJson(url);
            if (!json || !json.data) return [];

            return json.data
                .filter(item => {
                    const rMatch = String(item.route || '').trim().toUpperCase() === cfg.route.toUpperCase();
                    return rMatch && item.eta;
                })
                .map(item => ({
                    company: '九巴',
                    eta: item.eta,
                    rmk: item.rmk_tc || `往 ${cfg.destText}`
                }));
        }

        async function fetchCTBETA(cfg) {
            if (!cfg.ctbStopId) return [];
            const url = `https://data.etabus.gov.hk/v1/transport/citybus/eta/CTB/${cfg.ctbStopId}/${cfg.route}`;
            const json = await safeFetchJson(url);
            if (!json || !json.data) return [];

            return json.data
                .filter(item => item.eta)
                .map(item => ({
                    company: '城巴',
                    eta: item.eta,
                    rmk: item.rmk_tc || `往 ${cfg.destText}`
                }));
        }

        async function fetchSingleETA(cfg) {
            const [kmbList, ctbList] = await Promise.all([
                fetchKMBETA(cfg),
                fetchCTBETA(cfg)
            ]);

            const merged = [...kmbList, ...ctbList];
            
            // 剔除無效 ETA 並按時間升序排序
            const valid = merged.filter(x => x.eta && !isNaN(new Date(x.eta).getTime()));
            valid.sort((a, b) => new Date(a.eta) - new Date(b.eta));

            return valid.slice(0, 3);
        }

        async function fetchAllETA() {
            const container = document.getElementById('bus-container');
            const statusText = document.getElementById('status-text');

            // 逐一或並行讀取，並加上容錯處理
            const results = await Promise.all(ROUTES_CONFIG.map(async (cfg) => {
                const etas = await fetchSingleETA(cfg);
                return { cfg, etas };
            }));

            statusText.innerText = `最後更新: ${new Date().toLocaleTimeString()} (數據正常)`;

            container.innerHTML = results.map(({ cfg, etas }) => {
                let etaBadgesHTML = '';

                if (!etas || etas.length === 0) {
                    etaBadgesHTML = `<div class="p-3 bg-slate-100 rounded-xl text-slate-400 text-sm text-center border border-slate-200">目前時段無班次 / 非服務時間</div>`;
                } else {
                    etaBadgesHTML = etas.map((item, index) => {
                        const mins = getMinutesDiff(item.eta);
                        const isFirst = index === 0;
                        const cardBg = isFirst 
                            ? 'bg-amber-50 text-amber-900 border-amber-300' 
                            : 'bg-emerald-50 text-emerald-900 border-emerald-200';
                        const badgeColor = isFirst ? 'text-amber-600 font-extrabold' : 'text-emerald-700 font-bold';
                        const timeText = mins === null ? '----' : (mins <= 0 ? '即將開出' : `${mins} 分鐘`);
                        const companyTag = item.company === '城巴' 
                            ? '<span class="bg-yellow-400 text-slate-900 font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">城巴</span>'
                            : '<span class="bg-red-600 text-white font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">九巴</span>';

                        return `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${cardBg} mb-2.5 shadow-sm">
                                <div class="flex items-center">
                                    ${companyTag}
                                    <span class="text-xs text-slate-500">${item.rmk}</span>
                                </div>
                                <span class="text-xl tracking-tight ${badgeColor}">${timeText}</span>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-3xl font-black text-emerald-600 tracking-tight">${cfg.route}</span>
                                <p class="text-base font-bold text-slate-800 mt-0.5">${cfg.stopName}</p>
                            </div>
                            <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full border border-emerald-200">往 ${cfg.destText}</span>
                        </div>
                        <div class="space-y-1">
                            ${etaBadgesHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchAllETA();
        setInterval(fetchAllETA, 30000);
    </script>
</body>
</html>
