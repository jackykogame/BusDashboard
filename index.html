<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>巴士 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #ffffff;
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col justify-between select-none bg-white">

    <!-- 頂部時間與標題 -->
    <header class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
        <div>
            <h1 class="text-2xl font-black tracking-wide text-emerald-700">出門 Dashboard</h1>
            <p class="text-xs text-slate-500 mt-0.5">即時到站時間 (全網絡智慧修復版)</p>
        </div>
        <div class="text-right">
            <div id="clock" class="text-3xl font-extrabold tracking-wider text-amber-500">00:00:00</div>
            <div id="date" class="text-xs text-slate-500">----/--/--</div>
        </div>
    </header>

    <!-- 巴士路線列表卡片區 -->
    <main id="bus-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 my-auto">
        <div class="p-6 bg-slate-50 rounded-2xl text-slate-400 text-center border border-slate-200 shadow-sm">載入路線數據中...</div>
    </main>

    <!-- 頁腳與控制區 -->
    <footer class="mt-6 flex justify-between items-center text-xs text-slate-500 border-t border-slate-200 pt-4">
        <span id="status-text">數據來源：Data.gov.hk (九巴 & 城巴 API)</span>
        <button onclick="fetchAllETA()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-1.5 rounded-lg active:scale-95 transition shadow-sm">
            🔄 立即更新
        </button>
    </footer>

    <script>
        const ROUTES_CONFIG = [
            {
                id: "219X_LKC",
                route: "219X",
                destText: "尖沙咀",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: null,
                dir: "O",
                serviceRemark: "尾班車 20:00"
            },
            {
                id: "219X_KRN",
                route: "219X",
                destText: "尖沙咀",
                stopName: "山谷道",
                kmbStopId: "BA06E8E2D7705B85",
                ctbStopId: null,
                dir: "O",
                serviceRemark: "尾班車 20:00"
            },
            {
                id: "17_RHM",
                route: "17",
                destText: "愛民",
                stopName: "采頤花園",
                kmbStopId: "B7EBFDEBC62C5B97",
                ctbStopId: null,
                dir: "O",
                serviceRemark: "全日服務"
            },
            {
                id: "621_LKC",
                route: "621",
                destText: "中環",
                stopName: "麗港城總站",
                kmbStopId: "C1BD1F3A215CD41F",
                ctbStopId: "001737",
                dir: "O",
                serviceRemark: "晨早特別線 (07:10-08:40)"
            },
            {
                id: "621_WCH",
                route: "621",
                destText: "麗港城",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422",
                dir: "I",
                serviceRemark: "黃昏特別線 (17:35-18:30)"
            },
            {
                id: "641_KY",
                route: "641",
                destText: "啟業",
                stopName: "菲林明道",
                kmbStopId: "4B4791E88DC29447",
                ctbStopId: "002422",
                dir: "I",
                serviceRemark: "黃昏特別線 (17:15-19:30)"
            }
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString('zh-HK', { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getMinutesDiff(etaTimeStr) {
            if (!etaTimeStr) return null;
            const etaTime = new Date(etaTimeStr);
            const now = new Date();
            if (isNaN(etaTime.getTime())) return null;
            const diffMs = etaTime - now;
            const diffMins = Math.floor(diffMs / 60000);
            return diffMins < 0 ? 0 : diffMins;
        }

        async function fetchWithTimeout(url, options = {}, timeout = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal
                });
                clearTimeout(id);
                if (!response.ok) return { error: true, status: response.status };
                const data = await response.json();
                return { error: false, data };
            } catch (error) {
                clearTimeout(id);
                return { error: true, message: error.message };
            }
        }

        async function fetchKMBETA(cfg) {
            if (!cfg.kmbStopId) return { list: [], err: false };
            const url = `https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${cfg.kmbStopId}`;
            const res = await fetchWithTimeout(url);
            if (res.error || !res.data || !Array.isArray(res.data.data)) {
                return { list: [], err: true };
            }

            const list = res.data.data
                .filter(item => {
                    const rMatch = String(item.route || '').trim().toUpperCase() === cfg.route.toUpperCase();
                    const dirMatch = !cfg.dir || item.dir === cfg.dir;
                    return rMatch && dirMatch && item.eta;
                })
                .map(item => ({
                    company: '九巴',
                    eta: item.eta,
                    rmk: item.rmk_tc || `往 ${cfg.destText}`
                }));

            return { list, err: false };
        }

        async function fetchCTBETA(cfg) {
            if (!cfg.ctbStopId) return { list: [], err: false };
            const url1 = `https://rt.data.gov.hk/v1/transport/citybus/eta/ctb/${cfg.ctbStopId}/${cfg.route}`;
            let res = await fetchWithTimeout(url1);

            if (res.error || !res.data || !Array.isArray(res.data.data)) {
                const url2 = `https://data.etabus.gov.hk/v1/transport/citybus/eta/ctb/${cfg.ctbStopId}/${cfg.route}`;
                res = await fetchWithTimeout(url2);
            }

            if (res.error || !res.data || !Array.isArray(res.data.data)) {
                return { list: [], err: true };
            }

            const list = res.data.data
                .filter(item => item.eta)
                .map(item => ({
                    company: '城巴',
                    eta: item.eta,
                    rmk: item.rmk_tc || `往 ${cfg.destText}`
                }));

            return { list, err: false };
        }

        async function fetchSingleETA(cfg) {
            const [kmbRes, ctbRes] = await Promise.all([
                fetchKMBETA(cfg),
                fetchCTBETA(cfg)
            ]);

            const merged = [...kmbRes.list, ...ctbRes.list];
            const valid = merged.filter(x => x.eta && !isNaN(new Date(x.eta).getTime()));
            valid.sort((a, b) => new Date(a.eta) - new Date(b.eta));

            const isApiError = (cfg.kmbStopId && kmbRes.err) && (cfg.ctbStopId ? ctbRes.err : true);

            return { etas: valid.slice(0, 3), isApiError };
        }

        async function fetchAllETA() {
            const container = document.getElementById('bus-container');
            const statusText = document.getElementById('status-text');

            const results = await Promise.all(ROUTES_CONFIG.map(async (cfg) => {
                const { etas, isApiError } = await fetchSingleETA(cfg);
                return { cfg, etas, isApiError };
            }));

            statusText.innerText = `最後更新: ${new Date().toLocaleTimeString()} (資料已連線更新)`;

            container.innerHTML = results.map(({ cfg, etas, isApiError }) => {
                let etaBadgesHTML = '';

                if (isApiError) {
                    etaBadgesHTML = `<div class="p-3 bg-red-50 rounded-xl text-red-500 text-sm text-center border border-red-200 font-medium">⚠️ 網絡連線 / API 服務回應異常</div>`;
                } else if (!etas || etas.length === 0) {
                    etaBadgesHTML = `
                        <div class="p-3 bg-slate-100 rounded-xl text-slate-500 text-sm text-center border border-slate-200">
                            非服務時間 / 目前無班次
                            <div class="text-[11px] text-slate-400 mt-0.5">備註：${cfg.serviceRemark}</div>
                        </div>
                    `;
                } else {
                    etaBadgesHTML = etas.map((item, index) => {
                        const mins = getMinutesDiff(item.eta);
                        const isFirst = index === 0;
                        const cardBg = isFirst 
                            ? 'bg-amber-50 text-amber-900 border-amber-300' 
                            : 'bg-emerald-50 text-emerald-900 border-emerald-200';
                        const badgeColor = isFirst ? 'text-amber-600 font-extrabold' : 'text-emerald-700 font-bold';
                        const timeText = mins === null ? '----' : (mins <= 0 ? '即將開出' : `${mins} 分鐘`);
                        const companyTag = item.company === '城巴' 
                            ? '<span class="bg-yellow-400 text-slate-900 font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">城巴</span>'
                            : '<span class="bg-red-600 text-white font-extrabold text-[10px] px-1.5 py-0.5 rounded mr-1.5 shadow-sm">九巴</span>';

                        return `
                            <div class="flex items-center justify-between p-3 rounded-xl border ${cardBg} mb-2.5 shadow-sm">
                                <div class="flex items-center">
                                    ${companyTag}
                                    <span class="text-xs text-slate-500">${item.rmk}</span>
                                </div>
                                <span class="text-xl tracking-tight ${badgeColor}">${timeText}</span>
                            </div>
                        `;
                    }).join('');
                }

                return `
                    <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <span class="text-3xl font-black text-emerald-600 tracking-tight">${cfg.route}</span>
                                <p class="text-base font-bold text-slate-800 mt-0.5">${cfg.stopName}</p>
                            </div>
                            <span class="text-xs font-semibold bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full border border-emerald-200">往 ${cfg.destText}</span>
                        </div>
                        <div class="space-y-1">
                            ${etaBadgesHTML}
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchAllETA();
        setInterval(fetchAllETA, 30000);
    </script>
</body>
</html>
